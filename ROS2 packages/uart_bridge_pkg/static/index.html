<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rover Dashboard</title>
    <!-- Montserrat font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .panel {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex: 1;
        }
        .chart-container {
            flex: 2;
        }
        canvas {
            width: 100% !important;
            height: 400px !important;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select, button {
            padding: 10px;
            font-family: 'Montserrat', sans-serif;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: #fff;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Rover Telemetry & Control</h1>
    
    <div class="container">
        <!-- PID Control Panel -->
        <div class="panel">
            <h2>PID Tuning</h2>
            <form id="pid-form">
                <div class="form-group">
                    <label for="motor_id">Motor ID:</label>
                    <select id="motor_id" name="motor_id">
                        <option value="0">Motor 0 (Front Left)</option>
                        <option value="1">Motor 1 (Mid Left)</option>
                        <option value="2">Motor 2 (Rear Left)</option>
                        <option value="3">Motor 3 (Front Right)</option>
                        <option value="4">Motor 4 (Mid Right)</option>
                        <option value="5">Motor 5 (Rear Right)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="kp">Kp:</label>
                    <input type="number" id="kp" name="kp" step="0.01" value="1.0" required>
                </div>
                <div class="form-group">
                    <label for="ki">Ki:</label>
                    <input type="number" id="ki" name="ki" step="0.01" value="0.0" required>
                </div>
                <div class="form-group">
                    <label for="kd">Kd:</label>
                    <input type="number" id="kd" name="kd" step="0.01" value="0.0" required>
                </div>
                <button type="submit">Update PID</button>
            </form>
        </div>

        <!-- Chart Panel -->
        <div class="panel chart-container">
            <h2>Encoder Speeds</h2>
            <canvas id="encoderChart"></canvas>
        </div>
    </div>

    <script>
        const socket = io();

        // Chart setup
        const ctx = document.getElementById('encoderChart').getContext('2d');
        
        const colors = [
            '#ff6384', // Motor 0
            '#36a2eb', // Motor 1
            '#ffce56', // Motor 2
            '#4bc0c0', // Motor 3
            '#9966ff', // Motor 4
            '#ff9f40'  // Motor 5
        ];

        // Prepare empty data for 50 points
        const maxPoints = 50;
        const labels = Array(maxPoints).fill('');
        const datasets = [];
        
        for (let i = 0; i < 6; i++) {
            datasets.push({
                label: `Motor ${i}`,
                data: Array(maxPoints).fill(0),
                borderColor: colors[i],
                backgroundColor: colors[i],
                fill: false,
                tension: 0.1,
                pointRadius: 0
            });
        }

        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { display: false },
                    y: { 
                        display: true,
                        grid: { color: '#333' }
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: '#fff' }
                    }
                }
            }
        });

        // Socket.IO event listener for encoder data
        socket.on('encoder_data', function(data) {
            // data is an array of 6 integers
            for (let i = 0; i < 6; i++) {
                chart.data.datasets[i].data.push(data[i]);
                chart.data.datasets[i].data.shift();
            }
            chart.update();
        });

        // Handle PID form submission
        document.getElementById('pid-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const payload = {
                motor_id: parseInt(document.getElementById('motor_id').value),
                kp: parseFloat(document.getElementById('kp').value),
                ki: parseFloat(document.getElementById('ki').value),
                kd: parseFloat(document.getElementById('kd').value)
            };
            socket.emit('update_pid', payload);
            console.log("PID update emitted:", payload);
        });
    </script>
</body>
</html>
